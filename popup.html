<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RVCE Auto-Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    
    :root {
      --bg-color: #0f172a;
      --text-color: #f8fafc;
      --input-bg: #1e293b;
      --input-border: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
    }

    body {
      margin: 0;
      padding: 24px;
      width: 280px;
      font-family: 'Inter', sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
    }

    .header-container {
      text-align: center;
      margin-bottom: 20px;
    }

    h2 {
      margin: 0 0 4px 0;
      font-size: 20px;
      font-weight: 600;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin: 0;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 500;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid var(--input-border);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--text-color);
      font-size: 14px;
      transition: all 0.2s ease;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    input::placeholder {
      color: #64748b;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 4px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background: var(--primary-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    #status {
      margin-top: 16px;
      font-size: 13px;
      text-align: center;
      min-height: 18px;
      color: var(--success);
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .check-icon {
      width: 16px;
      height: 16px;
      background-color: var(--success);
      -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>') no-repeat center;
      mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>') no-repeat center;
    }
  </style>
</head>
<body>
  <div class="header-container">
    <h2>RVCE Auto-Login</h2>
    <p class="subtitle">Secure Gateway Access</p>
  </div>
  
  <div class="form-group">
    <label for="username">Username / SRN</label>
    <input type="text" id="username" placeholder="Enter SRN">
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter Password">
  </div>
  
  <button id="saveBtn">Save Credentials</button>
  <div id="status"><span class="check-icon"></span>Saved securely</div>
  
  <script src="popup.js"></script>
</body>
</html>
